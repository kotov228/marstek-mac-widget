name: Bug report
description: Report a reproducible problem in Marstek Mac Widget
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a problem. Do not include station IP addresses,
        BLE identifiers, tokens, or other private network details.
  - type: input
    id: version
    attributes:
      label: App version
      description: The version shown in Settings or the GitHub release tag.
      placeholder: v1.2.0
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 26.0
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Menu bar telemetry
        - History graph
        - Settings or operating mode
        - Station discovery
        - BLE / BMS diagnostics
        - In-app updates
        - Build or tests
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or screenshots
      description: Redact all private network details before attaching logs.

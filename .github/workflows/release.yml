name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: github.actor == 'kotov228'
    runs-on: macos-26
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build application
        run: ./build-app.sh

      - name: Package application
        run: ditto -c -k --keepParent "Marstek Widget.app" "Marstek-Mac-Widget-${GITHUB_REF_NAME}.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="build-${GITHUB_SHA::7}"
          fi
          gh release create "$release_tag" "Marstek-Mac-Widget-${GITHUB_REF_NAME}.zip" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Marstek Mac Widget $release_tag" \
            --generate-notes
